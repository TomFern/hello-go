version: v1.0
name: Continuous Integration Pipeline
agent:
  machine:
    type: e1-standard-2
    os_image: ubuntu2004
global_job_config:
  prologue:
    commands:
      - sem-version go 1.22
      - checkout
blocks:
  - name: Build
    task:
      jobs:
        - name: go build
          commands:
            - go build -o hello.bin main.go
            - '#artifact push workflow --force hello.bin'
            - '#artifact pull workflow hello.bin'
            - go test -v
      env_vars:
        - name: GOOS
          value: linux
        - name: GOARCH
          value: amd64
    dependencies: []
  - name: 'Block #2'
    dependencies:
      - Build
    task:
      jobs:
        - name: 'Job #1'
          commands:
            - sem-version node $NODE_VERSION
            - npm test
            - sem-service start $DB_BACKEND
          matrix:
            - env_var: NODE_VERSION
              values:
                - '24'
                - '22'
                - '20'
            - env_var: DB_BACKEND
              values:
                - mysql
                - postgres
